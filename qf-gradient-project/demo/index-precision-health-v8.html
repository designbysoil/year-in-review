<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QF Gradient - Precision Health (Blobby)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FFE9D2;
      color: white;
      overflow: hidden;
    }
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding-top: 15vh;
      align-items: center;
      text-align: center;
      z-index: 10;
    }
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      z-index: 20;
    }
    .logo { font-size: 14px; opacity: 0.85; font-weight: 500; }
    .subtitle { font-size: 11px; opacity: 0.5; letter-spacing: 2px; text-transform: uppercase; }
    .theme-label { font-size: 11px; opacity: 0.4; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; }
    .theme-name { font-size: clamp(36px, 7vw, 72px); font-weight: 300; letter-spacing: -1px; margin-bottom: 20px; }
    .year { font-size: clamp(52px, 10vw, 100px); font-weight: 200; opacity: 0.2; letter-spacing: -3px; }
    .info {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      opacity: 0.35;
      z-index: 20;
      color: #11362A;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="header">
    <span class="logo">Qatar Foundation</span>
    <span class="subtitle">2025 Year in Review</span>
  </div>

  <div class="overlay">
    <span class="theme-label">Theme</span>
    <h1 class="theme-name">Precision Health</h1>
    <span class="year">2025</span>
  </div>

  <div class="info">Precision Health Theme - Blobby v8</div>

  <script>
    const vertexShader = `
      attribute vec2 a_position;
      varying vec2 v_uv;
      void main() {
        v_uv = a_position * 0.5 + 0.5;
        gl_Position = vec4(a_position, 0.0, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;
      varying vec2 v_uv;
      uniform float u_time;
      uniform vec2 u_resolution;

      // ===========================================
      // COLORS - Precision Health palette
      // ===========================================
      const vec3 BASE_COLOR = vec3(1.0, 0.914, 0.824);           // #FFE9D2 warm beige
      const vec3 CORAL = vec3(0.878, 0.480, 0.380);              // Warm coral
      const vec3 ROSE = vec3(0.820, 0.420, 0.520);               // Rose pink
      const vec3 MAUVE = vec3(0.680, 0.380, 0.560);              // Mauve
      const vec3 PURPLE = vec3(0.520, 0.320, 0.600);             // Purple

      // ===========================================
      // SIMPLEX 3D NOISE
      // ===========================================
      vec4 permute(vec4 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
      vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

      float snoise(vec3 v) {
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod(i, 289.0);
        vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 1.0/7.0;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
      }

      // FBM with 2 octaves for softer blobs
      float fbm2(vec3 p) {
        float value = 0.0;
        float amplitude = 0.6;
        value += amplitude * snoise(p);
        amplitude *= 0.4;
        value += amplitude * snoise(p * 2.0);
        return value;
      }

      void main() {
        vec2 uv = v_uv;
        float aspect = u_resolution.x / u_resolution.y;
        vec2 coord = vec2(uv.x * aspect, uv.y);

        float t = u_time * 0.06; // Slow drift

        // ===========================================
        // MULTIPLE INDEPENDENT BLOB LAYERS
        // Each blob has its own position, size, and movement
        // ===========================================

        // Blob 1: Large, slow-moving coral/rose blob
        vec2 blob1Center = vec2(
          0.3 + sin(t * 0.4) * 0.3,
          0.4 + cos(t * 0.3) * 0.25
        );
        float blob1Noise = fbm2(vec3(coord * 0.15 + blob1Center * 2.0, t * 0.2));
        blob1Noise = blob1Noise * 0.5 + 0.5;
        float blob1 = smoothstep(0.35, 0.65, blob1Noise);

        // Blob 2: Medium blob, different movement pattern
        vec2 blob2Center = vec2(
          0.7 + cos(t * 0.35 + 1.5) * 0.35,
          0.6 + sin(t * 0.45 + 2.0) * 0.3
        );
        float blob2Noise = fbm2(vec3(coord * 0.18 + blob2Center * 2.0 + 50.0, t * 0.25 + 100.0));
        blob2Noise = blob2Noise * 0.5 + 0.5;
        float blob2 = smoothstep(0.38, 0.68, blob2Noise);

        // Blob 3: Smaller accent blob
        vec2 blob3Center = vec2(
          0.5 + sin(t * 0.5 + 3.0) * 0.4,
          0.3 + cos(t * 0.4 + 1.0) * 0.35
        );
        float blob3Noise = fbm2(vec3(coord * 0.2 + blob3Center * 2.0 + 100.0, t * 0.3 + 50.0));
        blob3Noise = blob3Noise * 0.5 + 0.5;
        float blob3 = smoothstep(0.4, 0.7, blob3Noise);

        // Blob 4: Background variation blob
        vec2 blob4Center = vec2(
          0.4 + cos(t * 0.25 + 4.0) * 0.5,
          0.7 + sin(t * 0.35 + 2.5) * 0.25
        );
        float blob4Noise = fbm2(vec3(coord * 0.12 + blob4Center * 1.5 + 150.0, t * 0.15 + 200.0));
        blob4Noise = blob4Noise * 0.5 + 0.5;
        float blob4 = smoothstep(0.32, 0.62, blob4Noise);

        // ===========================================
        // COMPOSITE BLOBS WITH COLORS
        // ===========================================
        vec3 color = BASE_COLOR;

        // Layer 1: Purple/Mauve base blob (darkest, background)
        color = mix(color, PURPLE, blob4 * 0.6);

        // Layer 2: Mauve blob
        color = mix(color, MAUVE, blob2 * 0.7);

        // Layer 3: Rose blob
        color = mix(color, ROSE, blob3 * 0.65);

        // Layer 4: Coral blob (warmest, foreground)
        color = mix(color, CORAL, blob1 * 0.6);

        // ===========================================
        // SUBTLE DEPTH VARIATION
        // ===========================================
        float depthNoise = fbm2(vec3(coord * 0.3, t * 0.1 + 300.0));
        depthNoise = depthNoise * 0.5 + 0.5;
        color *= (0.95 + depthNoise * 0.1);

        // Very subtle vignette
        float vignette = 1.0 - length((uv - 0.5) * 0.3);
        vignette = smoothstep(0.0, 1.0, vignette);
        color = mix(color * 0.98, color, vignette);

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    // =====================================================
    // WEBGL SETUP
    // =====================================================
    const canvas = document.getElementById('canvas');
    const gl = canvas.getContext('webgl', { alpha: false, antialias: true });

    function createShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    const vs = createShader(gl.VERTEX_SHADER, vertexShader);
    const fs = createShader(gl.FRAGMENT_SHADER, fragmentShader);
    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

    const posLoc = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
      time: gl.getUniformLocation(program, 'u_time'),
      resolution: gl.getUniformLocation(program, 'u_resolution'),
    };

    function resize() {
      const dpr = Math.min(devicePixelRatio, 2);
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
    }

    resize();
    addEventListener('resize', resize);

    const startTime = performance.now();

    function render(now) {
      gl.uniform1f(uniforms.time, (now - startTime) / 1000);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
