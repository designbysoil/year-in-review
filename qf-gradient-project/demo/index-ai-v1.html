<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QF Gradient - AI Theme (Refined)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #EEE9DE;
      color: white;
      overflow: hidden;
    }
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 10;
    }
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      z-index: 20;
    }
    .logo { font-size: 14px; opacity: 0.85; font-weight: 500; }
    .subtitle { font-size: 11px; opacity: 0.5; letter-spacing: 2px; text-transform: uppercase; }
    .theme-label { font-size: 11px; opacity: 0.4; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; }
    .theme-name { font-size: clamp(36px, 7vw, 72px); font-weight: 300; letter-spacing: -1px; margin-bottom: 20px; }
    .year { font-size: clamp(52px, 10vw, 100px); font-weight: 200; opacity: 0.2; letter-spacing: -3px; }
    .info {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      opacity: 0.35;
      z-index: 20;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="header">
    <span class="logo">Qatar Foundation</span>
    <span class="subtitle">2025 Year in Review</span>
  </div>

  <div class="overlay">
    <span class="theme-label">Theme</span>
    <h1 class="theme-name">Artificial Intelligence</h1>
    <span class="year">2025</span>
  </div>

  <div class="info">AI Theme - Multi-layer color blending</div>

  <script>
    // =====================================================
    // AI THEME - RICH MULTI-LAYER GRADIENT
    // =====================================================
    //
    // Based on the original blob approach but with:
    // - Multiple color layers that blend together
    // - Richer, deeper colors
    // - More visible organic movement
    //
    // Figma reference colors:
    // - #11362A (dark teal)
    // - #419B7E (sage green)
    // - #EEE9DE (cream)
    //
    // User requested: blue-khaki blend
    // Interpreting as: cool blues/teals + warm khaki/sand tones

    const vertexShader = `
      attribute vec2 a_position;
      varying vec2 v_uv;
      void main() {
        v_uv = a_position * 0.5 + 0.5;
        gl_Position = vec4(a_position, 0.0, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;
      varying vec2 v_uv;
      uniform float u_time;
      uniform vec2 u_resolution;

      // Layer 1: Deep cool tones (teal/blue)
      uniform vec3 u_cool1;
      uniform vec3 u_cool2;

      // Layer 2: Warm tones (khaki/sand)
      uniform vec3 u_warm1;
      uniform vec3 u_warm2;

      // Base/blend color
      uniform vec3 u_base;

      // ===========================================
      // PARAMETERS - Tuned for visible blobs
      // ===========================================
      #define NOISE_SCALE 0.55       // Bigger blobs (was 0.8)
      #define SPEED 0.14             // Noticeable movement
      #define LAYER_BLEND 0.5        // How layers mix

      // ===========================================
      // SIMPLEX 3D NOISE
      // ===========================================
      vec4 permute(vec4 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
      vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

      float snoise(vec3 v) {
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod(i, 289.0);
        vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 1.0/7.0;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
      }

      // FBM with multiple octaves for richness
      float fbm(vec3 p, int octaves) {
        float value = 0.0;
        float amplitude = 0.5;
        float frequency = 1.0;
        for (int i = 0; i < 4; i++) {
          if (i >= octaves) break;
          value += amplitude * snoise(p * frequency);
          amplitude *= 0.5;
          frequency *= 2.0;
        }
        return value;
      }

      void main() {
        vec2 uv = v_uv;
        float aspect = u_resolution.x / u_resolution.y;
        vec2 coord = vec2(uv.x * aspect, uv.y);
        float t = u_time * SPEED;

        // ===========================================
        // LAYER 1: COOL TONES (Teal/Blue blobs)
        // ===========================================
        // Large, slow-moving blobs
        float cool_noise1 = fbm(vec3(coord * NOISE_SCALE, t * 0.35), 3);
        float cool_noise2 = fbm(vec3(coord * NOISE_SCALE * 0.7 + 30.0, t * 0.25 + 50.0), 2);

        // Combine and normalize
        float cool_blend = cool_noise1 * 0.6 + cool_noise2 * 0.4;
        cool_blend = cool_blend * 0.5 + 0.5; // Map to 0-1
        cool_blend = smoothstep(0.3, 0.7, cool_blend);

        // Cool color gradient
        vec3 coolColor = mix(u_cool1, u_cool2, cool_blend);

        // ===========================================
        // LAYER 2: WARM TONES (Khaki/Sand blobs)
        // ===========================================
        // Different pattern, offset in space and time
        float warm_noise1 = fbm(vec3(coord * NOISE_SCALE * 0.8 + 100.0, t * 0.4 + 100.0), 3);
        float warm_noise2 = fbm(vec3(coord * NOISE_SCALE * 1.2 + 150.0, t * 0.3 + 200.0), 2);

        float warm_blend = warm_noise1 * 0.55 + warm_noise2 * 0.45;
        warm_blend = warm_blend * 0.5 + 0.5;
        warm_blend = smoothstep(0.25, 0.75, warm_blend);

        // Warm color gradient
        vec3 warmColor = mix(u_warm1, u_warm2, warm_blend);

        // ===========================================
        // LAYER 3: BLEND MASK (How layers combine)
        // ===========================================
        // This controls where cool vs warm dominates
        float blend_noise = fbm(vec3(coord * NOISE_SCALE * 0.6 + 200.0, t * 0.2 + 300.0), 2);
        blend_noise = blend_noise * 0.5 + 0.5;

        // Add vertical bias (cool on top, warm on bottom)
        float verticalBias = uv.y * 0.4;
        float layerMix = blend_noise * 0.7 + verticalBias;
        layerMix = smoothstep(0.2, 0.8, layerMix);

        // ===========================================
        // COMPOSITE LAYERS
        // ===========================================
        vec3 color = mix(coolColor, warmColor, layerMix);

        // Add subtle brightness variation for depth
        float brightness = 1.0 + cool_noise1 * 0.1;
        color *= brightness;

        // Soft vignette
        float vignette = 1.0 - length((uv - 0.5) * 0.35);
        vignette = smoothstep(0.0, 1.0, vignette);
        color = mix(color * 0.94, color, vignette);

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    // =====================================================
    // AI THEME COLORS
    // =====================================================
    // Cool layer: Teal/blue tones
    // Warm layer: Khaki/sand/sage tones

    const COLORS = {
      // Cool tones (teal/blue family)
      cool1: [0.067, 0.212, 0.165],    // #11362A - Deep teal (Figma)
      cool2: [0.255, 0.608, 0.494],    // #419B7E - Sage green (Figma)

      // Warm tones (khaki/sand family)
      warm1: [0.620, 0.600, 0.486],    // Khaki/olive
      warm2: [0.769, 0.729, 0.608],    // Light sand

      // Base
      base: [0.933, 0.914, 0.871],     // #EEE9DE - Cream
    };

    // =====================================================
    // WEBGL SETUP
    // =====================================================
    const canvas = document.getElementById('canvas');
    const gl = canvas.getContext('webgl', { alpha: false, antialias: true });

    function createShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    const vs = createShader(gl.VERTEX_SHADER, vertexShader);
    const fs = createShader(gl.FRAGMENT_SHADER, fragmentShader);
    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

    const posLoc = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
      time: gl.getUniformLocation(program, 'u_time'),
      resolution: gl.getUniformLocation(program, 'u_resolution'),
      cool1: gl.getUniformLocation(program, 'u_cool1'),
      cool2: gl.getUniformLocation(program, 'u_cool2'),
      warm1: gl.getUniformLocation(program, 'u_warm1'),
      warm2: gl.getUniformLocation(program, 'u_warm2'),
      base: gl.getUniformLocation(program, 'u_base'),
    };

    // Set static color uniforms
    gl.uniform3fv(uniforms.cool1, COLORS.cool1);
    gl.uniform3fv(uniforms.cool2, COLORS.cool2);
    gl.uniform3fv(uniforms.warm1, COLORS.warm1);
    gl.uniform3fv(uniforms.warm2, COLORS.warm2);
    gl.uniform3fv(uniforms.base, COLORS.base);

    function resize() {
      const dpr = Math.min(devicePixelRatio, 2);
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
    }

    resize();
    addEventListener('resize', resize);

    const startTime = performance.now();

    function render(now) {
      gl.uniform1f(uniforms.time, (now - startTime) / 1000);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
