<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QF Gradient - Precision Health (High Contrast Blobs)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FFE9D2;
      color: white;
      overflow: hidden;
    }
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding-top: 15vh;
      align-items: center;
      text-align: center;
      z-index: 10;
    }
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      z-index: 20;
    }
    .logo { font-size: 14px; opacity: 0.85; font-weight: 500; }
    .subtitle { font-size: 11px; opacity: 0.5; letter-spacing: 2px; text-transform: uppercase; }
    .theme-label { font-size: 11px; opacity: 0.4; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; }
    .theme-name { font-size: clamp(36px, 7vw, 72px); font-weight: 300; letter-spacing: -1px; margin-bottom: 20px; }
    .year { font-size: clamp(52px, 10vw, 100px); font-weight: 200; opacity: 0.2; letter-spacing: -3px; }
    .info {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      opacity: 0.35;
      z-index: 20;
      color: #11362A;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="header">
    <span class="logo">Qatar Foundation</span>
    <span class="subtitle">2025 Year in Review</span>
  </div>

  <div class="overlay">
    <span class="theme-label">Theme</span>
    <h1 class="theme-name">Precision Health</h1>
    <span class="year">2025</span>
  </div>

  <div class="info">Precision Health Theme - v9</div>

  <script>
    const vertexShader = `
      attribute vec2 a_position;
      varying vec2 v_uv;
      void main() {
        v_uv = a_position * 0.5 + 0.5;
        gl_Position = vec4(a_position, 0.0, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;
      varying vec2 v_uv;
      uniform float u_time;
      uniform vec2 u_resolution;

      // ===========================================
      // COLORS - HIGH CONTRAST
      // ===========================================
      const vec3 LIGHT_BEIGE = vec3(0.98, 0.92, 0.86);           // Light warm
      const vec3 CORAL = vec3(0.85, 0.50, 0.42);                 // Warm coral
      const vec3 ROSE = vec3(0.75, 0.40, 0.50);                  // Rose
      const vec3 MAUVE = vec3(0.60, 0.35, 0.52);                 // Darker mauve
      const vec3 PURPLE = vec3(0.45, 0.28, 0.50);                // Dark purple

      // ===========================================
      // SIMPLEX NOISE
      // ===========================================
      vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
      vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

      float snoise(vec3 v) {
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289(i);
        vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 1.0/7.0;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
      }

      void main() {
        vec2 uv = v_uv;
        float aspect = u_resolution.x / u_resolution.y;
        vec2 coord = vec2((uv.x - 0.5) * aspect, uv.y - 0.5);

        float t = u_time * 0.08;

        // ===========================================
        // LARGE DRIFTING METABALL-LIKE BLOBS
        // Using noise to distort circular shapes
        // ===========================================

        // Blob 1: Large blob drifting from left
        vec2 c1 = vec2(-0.3 + sin(t * 0.3) * 0.4, 0.1 + cos(t * 0.25) * 0.3);
        float d1 = length(coord - c1);
        float distort1 = snoise(vec3(coord * 1.5, t * 0.2)) * 0.15;
        float blob1 = 1.0 - smoothstep(0.2, 0.5, d1 + distort1);

        // Blob 2: Large blob drifting from right
        vec2 c2 = vec2(0.35 + cos(t * 0.35) * 0.35, -0.15 + sin(t * 0.3) * 0.35);
        float d2 = length(coord - c2);
        float distort2 = snoise(vec3(coord * 1.5 + 50.0, t * 0.25)) * 0.15;
        float blob2 = 1.0 - smoothstep(0.25, 0.55, d2 + distort2);

        // Blob 3: Medium blob, center-ish
        vec2 c3 = vec2(0.0 + sin(t * 0.4 + 2.0) * 0.3, 0.25 + cos(t * 0.35 + 1.0) * 0.25);
        float d3 = length(coord - c3);
        float distort3 = snoise(vec3(coord * 1.8 + 100.0, t * 0.3)) * 0.12;
        float blob3 = 1.0 - smoothstep(0.15, 0.4, d3 + distort3);

        // Blob 4: Background large blob
        vec2 c4 = vec2(-0.1 + cos(t * 0.2 + 3.0) * 0.5, -0.3 + sin(t * 0.25 + 2.0) * 0.3);
        float d4 = length(coord - c4);
        float distort4 = snoise(vec3(coord * 1.2 + 150.0, t * 0.15)) * 0.18;
        float blob4 = 1.0 - smoothstep(0.3, 0.65, d4 + distort4);

        // ===========================================
        // LAYER COMPOSITING - Back to Front
        // ===========================================
        vec3 color = LIGHT_BEIGE;

        // Background: Purple blob
        color = mix(color, PURPLE, blob4 * 0.9);

        // Mid-back: Mauve blob
        color = mix(color, MAUVE, blob2 * 0.85);

        // Mid-front: Rose blob
        color = mix(color, ROSE, blob3 * 0.8);

        // Foreground: Coral blob
        color = mix(color, CORAL, blob1 * 0.85);

        // ===========================================
        // SOFT GAUSSIAN-LIKE BLUR EFFECT
        // Add slight color bleeding between blobs
        // ===========================================
        float blendNoise = snoise(vec3(coord * 0.8, t * 0.1 + 500.0)) * 0.5 + 0.5;
        color = mix(color, color * (0.9 + blendNoise * 0.2), 0.3);

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    // =====================================================
    // WEBGL SETUP
    // =====================================================
    const canvas = document.getElementById('canvas');
    const gl = canvas.getContext('webgl', { alpha: false, antialias: true });

    function createShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    const vs = createShader(gl.VERTEX_SHADER, vertexShader);
    const fs = createShader(gl.FRAGMENT_SHADER, fragmentShader);
    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

    const posLoc = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
      time: gl.getUniformLocation(program, 'u_time'),
      resolution: gl.getUniformLocation(program, 'u_resolution'),
    };

    function resize() {
      const dpr = Math.min(devicePixelRatio, 2);
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
    }

    resize();
    addEventListener('resize', resize);

    const startTime = performance.now();

    function render(now) {
      gl.uniform1f(uniforms.time, (now - startTime) / 1000);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
