<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QF Gradient - Social Progress Theme</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FFE9D2;
      color: white;
      overflow: hidden;
    }
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding-top: 15vh;
      align-items: center;
      text-align: center;
      z-index: 10;
    }
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      z-index: 20;
    }
    .logo { font-size: 14px; opacity: 0.85; font-weight: 500; }
    .subtitle { font-size: 11px; opacity: 0.5; letter-spacing: 2px; text-transform: uppercase; }
    .theme-label { font-size: 11px; opacity: 0.4; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; }
    .theme-name { font-size: clamp(36px, 7vw, 72px); font-weight: 300; letter-spacing: -1px; margin-bottom: 20px; }
    .year { font-size: clamp(52px, 10vw, 100px); font-weight: 200; opacity: 0.2; letter-spacing: -3px; }
    .info {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      opacity: 0.35;
      z-index: 20;
      color: #11362A;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="header">
    <span class="logo">Qatar Foundation</span>
    <span class="subtitle">2025 Year in Review</span>
  </div>

  <div class="overlay">
    <span class="theme-label">Theme</span>
    <h1 class="theme-name">Social Progress</h1>
    <span class="year">2025</span>
  </div>

  <div class="info">Social Progress Theme v1</div>

  <script>
    const vertexShader = `
      attribute vec2 a_position;
      varying vec2 v_uv;
      void main() {
        v_uv = a_position * 0.5 + 0.5;
        gl_Position = vec4(a_position, 0.0, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;
      varying vec2 v_uv;
      uniform float u_time;
      uniform vec2 u_resolution;

      // ===========================================
      // FIGMA COLORS - Social Progress
      // Three-layer system with soft-light blending
      // ===========================================
      // Base Layer
      const vec3 BASE_COLOR = vec3(1.0, 0.914, 0.824);           // #FFE9D2 peachy cream

      // Layer 1: Primary gradient
      const vec3 PRIMARY_PURPLE = vec3(0.463, 0.259, 0.729);     // #7642BA purple at 44.8%
      const vec3 PRIMARY_GOLD = vec3(0.765, 0.561, 0.275);       // #C38F46 warm gold at 57.8%

      // Layer 2 & 3: Soft-light gradients (offset positions)
      const vec3 SOFTLIGHT_DARK = vec3(0.208, 0.114, 0.278);     // #351D47 dark purple at 15%
      const vec3 SOFTLIGHT_MID = vec3(0.490, 0.400, 0.635);      // #7D66A2 medium purple at 29%

      // ===========================================
      // PARAMETERS
      // ===========================================
      #define BLOB_SCALE 0.35
      #define SPEED 0.14
      #define BLOB_INTENSITY 0.55

      // ===========================================
      // SIMPLEX 3D NOISE
      // ===========================================
      vec4 permute(vec4 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
      vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

      float snoise(vec3 v) {
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod(i, 289.0);
        vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 1.0/7.0;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
      }

      // Optimized FBM: 2 octaves
      float fbm(vec3 p) {
        float value = 0.0;
        value += 0.667 * snoise(p);
        value += 0.333 * snoise(p * 2.0);
        return value;
      }

      // Soft-light blend (Pegtop formula)
      vec3 softLight(vec3 base, vec3 blend) {
        return (1.0 - 2.0 * blend) * base * base + 2.0 * blend * base;
      }

      void main() {
        vec2 uv = v_uv;
        float aspect = u_resolution.x / u_resolution.y;
        vec2 coord = vec2(uv.x * aspect, uv.y);
        float t = u_time * SPEED;

        // ===========================================
        // BLOB NOISE for organic movement
        // ===========================================
        float blob1 = fbm(vec3(coord * BLOB_SCALE, t * 0.3));
        blob1 = blob1 * 0.5 + 0.5;

        float blob2 = snoise(vec3(coord * BLOB_SCALE * 0.8 + 50.0, t * 0.25 + 100.0));
        blob2 = blob2 * 0.5 + 0.5;

        float blob3 = snoise(vec3(coord * BLOB_SCALE * 0.6 + 100.0, t * 0.2 + 50.0));
        blob3 = blob3 * 0.5 + 0.5;

        // Vertical position (0 at top, 1 at bottom) with blob influence
        float vertPos = 1.0 - uv.y;
        float blendFactor = mix(vertPos, blob1, BLOB_INTENSITY);

        // ===========================================
        // LAYER 1: Primary Gradient
        // transparent 0% → Purple 44.8% → Gold@73% 57.8% → transparent 100%
        // ===========================================
        vec3 primaryColor;
        float primaryAlpha;

        if (blendFactor < 0.448) {
          // Fade in to purple
          primaryColor = PRIMARY_PURPLE;
          primaryAlpha = smoothstep(0.0, 0.448, blendFactor);
        }
        else if (blendFactor < 0.578) {
          // Purple to gold transition
          float t = smoothstep(0.448, 0.578, blendFactor);
          primaryColor = mix(PRIMARY_PURPLE, PRIMARY_GOLD, t);
          primaryAlpha = mix(1.0, 0.73, t);
        }
        else {
          // Gold fading out
          primaryColor = PRIMARY_GOLD;
          primaryAlpha = 0.73 * (1.0 - smoothstep(0.578, 1.0, blendFactor));
        }

        // ===========================================
        // LAYER 2: First Soft-Light Gradient (offset -20%)
        // transparent 0% → Dark Purple 15% → Mid Purple 29% → transparent 100%
        // ===========================================
        float softBlend1 = mix(vertPos, blob2, BLOB_INTENSITY * 0.8);
        // Offset by 20% to simulate the higher position
        softBlend1 = softBlend1 + 0.20;

        vec3 softlightColor1;
        float softlightAlpha1;

        if (softBlend1 < 0.149) {
          softlightColor1 = SOFTLIGHT_DARK;
          softlightAlpha1 = smoothstep(0.0, 0.149, softBlend1);
        }
        else if (softBlend1 < 0.288) {
          float t = smoothstep(0.149, 0.288, softBlend1);
          softlightColor1 = mix(SOFTLIGHT_DARK, SOFTLIGHT_MID, t);
          softlightAlpha1 = 1.0;
        }
        else {
          softlightColor1 = SOFTLIGHT_MID;
          softlightAlpha1 = 1.0 - smoothstep(0.288, 0.8, softBlend1);
        }

        // ===========================================
        // LAYER 3: Second Soft-Light Gradient (full height position)
        // Same gradient as Layer 2 but different position
        // ===========================================
        float softBlend2 = mix(vertPos, blob2 * 0.9 + blob3 * 0.1, BLOB_INTENSITY * 0.7);

        vec3 softlightColor2;
        float softlightAlpha2;

        if (softBlend2 < 0.149) {
          softlightColor2 = SOFTLIGHT_DARK;
          softlightAlpha2 = smoothstep(0.0, 0.149, softBlend2);
        }
        else if (softBlend2 < 0.288) {
          float t = smoothstep(0.149, 0.288, softBlend2);
          softlightColor2 = mix(SOFTLIGHT_DARK, SOFTLIGHT_MID, t);
          softlightAlpha2 = 1.0;
        }
        else {
          softlightColor2 = SOFTLIGHT_MID;
          softlightAlpha2 = 1.0 - smoothstep(0.288, 0.9, softBlend2);
        }

        // ===========================================
        // COMPOSITE: Base + Layer 1 + Layer 2 + Layer 3
        // ===========================================
        // Start with base cream
        vec3 color = BASE_COLOR;

        // Apply Layer 1: Primary gradient (normal blend)
        color = mix(color, primaryColor, primaryAlpha);

        // Apply Layer 2: First soft-light (offset -20%)
        vec3 softResult1 = softLight(color, softlightColor1);
        color = mix(color, softResult1, softlightAlpha1);

        // Apply Layer 3: Second soft-light (full height position)
        vec3 softResult2 = softLight(color, softlightColor2);
        color = mix(color, softResult2, softlightAlpha2);

        // ===========================================
        // DEPTH variation
        // ===========================================
        float depth = blob3 * 0.06;
        color *= (1.0 + depth);

        // Subtle vignette
        float vignette = 1.0 - length((uv - 0.5) * 0.15);
        vignette = smoothstep(0.0, 1.0, vignette);
        color = mix(color * 0.98, color, vignette);

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    // =====================================================
    // PERFORMANCE CONFIG
    // =====================================================
    const PERF_CONFIG = {
      maxDPR: 1.5,
      targetFPS: 30,
      pauseWhenHidden: true
    };

    // =====================================================
    // WEBGL SETUP
    // =====================================================
    const canvas = document.getElementById('canvas');
    const gl = canvas.getContext('webgl', { alpha: false, antialias: true });

    function createShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    const vs = createShader(gl.VERTEX_SHADER, vertexShader);
    const fs = createShader(gl.FRAGMENT_SHADER, fragmentShader);
    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

    const posLoc = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
      time: gl.getUniformLocation(program, 'u_time'),
      resolution: gl.getUniformLocation(program, 'u_resolution'),
    };

    function resize() {
      const dpr = Math.min(devicePixelRatio, PERF_CONFIG.maxDPR);
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
    }

    resize();
    addEventListener('resize', resize);

    // =====================================================
    // ANIMATION LOOP
    // =====================================================
    const startTime = performance.now();
    const frameInterval = 1000 / PERF_CONFIG.targetFPS;
    let lastFrameTime = 0;
    let isRunning = true;
    let animationId = null;

    function render(now) {
      if (!isRunning) return;

      if (now - lastFrameTime < frameInterval) {
        animationId = requestAnimationFrame(render);
        return;
      }
      lastFrameTime = now;

      gl.uniform1f(uniforms.time, (now - startTime) / 1000);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      animationId = requestAnimationFrame(render);
    }

    if (PERF_CONFIG.pauseWhenHidden) {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          isRunning = false;
          if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
          }
        } else {
          isRunning = true;
          lastFrameTime = performance.now();
          animationId = requestAnimationFrame(render);
        }
      });
    }

    animationId = requestAnimationFrame(render);
  </script>
</body>
</html>
