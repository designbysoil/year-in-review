<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QF Animated Gradient v3 - Figma Match</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #EEE9DE;
      color: white;
      overflow: hidden;
    }
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 10;
      padding: 0 20%;
    }
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      z-index: 20;
    }
    .logo { font-size: 14px; opacity: 0.85; font-weight: 500; }
    .subtitle { font-size: 11px; opacity: 0.5; letter-spacing: 2px; text-transform: uppercase; }
    .theme-label {
      font-size: 11px;
      opacity: 0.6;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .theme-name {
      font-size: clamp(36px, 7vw, 72px);
      font-weight: 300;
      letter-spacing: -1px;
      margin-bottom: 20px;
      text-shadow: 0 2px 30px rgba(0,0,0,0.2);
    }
    .year {
      font-size: clamp(52px, 10vw, 100px);
      font-weight: 200;
      opacity: 0.12;
      letter-spacing: -3px;
    }
    .controls {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 20;
    }
    .btn {
      padding: 12px 24px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.75);
      cursor: pointer;
      border-radius: 6px;
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }
    .btn:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.4);
    }
    .btn.active {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.6);
      color: white;
    }
    .info {
      position: fixed;
      bottom: 88px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      opacity: 0.35;
      z-index: 20;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="header">
    <span class="logo">Qatar Foundation</span>
    <span class="subtitle">2025 Year in Review</span>
  </div>

  <div class="overlay">
    <span class="theme-label">Theme</span>
    <h1 class="theme-name" id="themeName">Artificial Intelligence</h1>
    <span class="year">2025</span>
  </div>

  <div class="info">WebGL · Figma-matched gradient stops</div>

  <div class="controls">
    <button class="btn active" data-theme="ai">AI</button>
    <button class="btn" data-theme="precisionHealth">Health</button>
    <button class="btn" data-theme="progressiveEducation">Education</button>
    <button class="btn" data-theme="socialProgress">Social</button>
    <button class="btn" data-theme="sustainability">Sustainability</button>
  </div>

  <script>
    // =====================================================
    // THEME CONFIGURATIONS - Exact Figma Gradient Stops
    // =====================================================
    //
    // Figma gradient structure (AI theme example):
    // - 0% to 34%: Solid dark teal (#11362A)
    // - 34% to 56%: Transition to sage (rgba(65,155,126,0.5))
    // - 56% to 68%: Fade to transparent cream
    // - 68%+: Cream background visible
    //
    // This creates a "top-heavy" effect with deep color filling
    // the upper portion, creating depth and gravitas.

    const THEMES = {
      ai: {
        name: 'Artificial Intelligence',
        // Figma: #11362A -> #419B7E -> transparent #EEE9DE
        primary: [0.067, 0.212, 0.165],      // #11362A - dark teal
        secondary: [0.255, 0.608, 0.494],    // #419B7E - sage green
        accent: [0.180, 0.380, 0.329],       // Muted forest teal
        // Gradient stops (normalized 0-1)
        stops: { solid: 0.34, via: 0.56, fade: 0.68 },
      },

      precisionHealth: {
        name: 'Precision Health',
        // Deep magenta -> dusty rose -> cream
        primary: [0.420, 0.180, 0.318],      // Deep magenta
        secondary: [0.659, 0.396, 0.494],    // Dusty rose
        accent: [0.529, 0.278, 0.439],       // Mid magenta
        stops: { solid: 0.30, via: 0.52, fade: 0.70 },
      },

      progressiveEducation: {
        name: 'Progressive Education',
        // Forest teal -> sage -> cream
        primary: [0.118, 0.282, 0.235],      // Deep teal (darker)
        secondary: [0.349, 0.537, 0.427],    // Fresh sage
        accent: [0.278, 0.412, 0.341],       // Mid teal
        stops: { solid: 0.32, via: 0.54, fade: 0.72 },
      },

      socialProgress: {
        name: 'Social Progress',
        // Deep purple -> mauve -> cream
        primary: [0.200, 0.149, 0.267],      // Deep purple
        secondary: [0.467, 0.357, 0.467],    // Mauve
        accent: [0.329, 0.255, 0.369],       // Mid purple
        stops: { solid: 0.32, via: 0.55, fade: 0.72 },
      },

      sustainability: {
        name: 'Sustainability',
        // Forest green -> olive -> cream
        primary: [0.165, 0.267, 0.200],      // Forest green
        secondary: [0.380, 0.467, 0.341],    // Olive sage
        accent: [0.278, 0.369, 0.278],       // Mid green
        stops: { solid: 0.30, via: 0.52, fade: 0.68 },
      },
    };

    // Base background color (cream)
    const BASE_COLOR = [0.933, 0.914, 0.871]; // #EEE9DE

    // =====================================================
    // SHADERS
    // =====================================================

    const vertexShader = `
      attribute vec2 a_position;
      varying vec2 v_uv;
      void main() {
        v_uv = a_position * 0.5 + 0.5;
        gl_Position = vec4(a_position, 0.0, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;
      varying vec2 v_uv;

      uniform float u_time;
      uniform vec2 u_resolution;

      // Theme colors
      uniform vec3 u_primary;     // Solid color (top)
      uniform vec3 u_secondary;   // Via color (transition)
      uniform vec3 u_accent;      // Soft-light accent
      uniform vec3 u_base;        // Background (cream)

      // Gradient stops
      uniform float u_stop_solid; // Where solid color ends
      uniform float u_stop_via;   // Where via color is centered
      uniform float u_stop_fade;  // Where fade completes

      // ===========================================
      // TUNABLE PARAMETERS
      // ===========================================
      #define NOISE_SCALE 0.5          // Blob size (lower = bigger)
      #define SPEED 0.15               // Base animation speed
      #define NOISE_INFLUENCE 0.12     // How much noise distorts gradient
      #define WAVE_AMOUNT 0.06         // Wave distortion
      #define SOFT_LIGHT_OPACITY 0.25  // Accent layer strength
      #define BREATHING_SPEED 0.25     // Pulse frequency

      // ===========================================
      // SIMPLEX 3D NOISE
      // ===========================================
      vec4 permute(vec4 x) {
        return mod(((x * 34.0) + 1.0) * x, 289.0);
      }

      vec4 taylorInvSqrt(vec4 r) {
        return 1.79284291400159 - 0.85373472095314 * r;
      }

      float snoise(vec3 v) {
        const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

        vec3 i = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);

        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);

        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;

        i = mod(i, 289.0);
        vec4 p = permute(permute(permute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));

        float n_ = 1.0 / 7.0;
        vec3 ns = n_ * D.wyz - D.xzx;

        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);

        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);

        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);

        vec4 s0 = floor(b0) * 2.0 + 1.0;
        vec4 s1 = floor(b1) * 2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));

        vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);

        vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
        p0 *= norm.x;
        p1 *= norm.y;
        p2 *= norm.z;
        p3 *= norm.w;

        vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
      }

      // FBM for organic movement
      float fbm(vec3 p, int octaves) {
        float value = 0.0;
        float amplitude = 0.5;
        float frequency = 1.0;
        for (int i = 0; i < 4; i++) {
          if (i >= octaves) break;
          value += amplitude * snoise(p * frequency);
          amplitude *= 0.5;
          frequency *= 2.0;
        }
        return value;
      }

      // Soft-light blend
      vec3 softLight(vec3 base, vec3 blend, float opacity) {
        vec3 result;
        for (int i = 0; i < 3; i++) {
          float b = base[i];
          float s = blend[i];
          if (s < 0.5) {
            result[i] = b - (1.0 - 2.0 * s) * b * (1.0 - b);
          } else {
            float d = (b < 0.25) ? ((16.0 * b - 12.0) * b + 4.0) * b : sqrt(b);
            result[i] = b + (2.0 * s - 1.0) * (d - b);
          }
        }
        return mix(base, result, opacity);
      }

      // ===========================================
      // MAIN
      // ===========================================
      void main() {
        vec2 uv = v_uv;
        float aspect = u_resolution.x / u_resolution.y;
        vec2 coord = vec2(uv.x * aspect, uv.y);

        float t = u_time * SPEED;

        // Breathing effect
        float breathe = sin(u_time * BREATHING_SPEED) * 0.5 + 0.5;

        // =========================================
        // NOISE LAYERS
        // =========================================

        // Primary large-scale movement
        float noise1 = fbm(vec3(coord * NOISE_SCALE, t * 0.4), 3);

        // Secondary wave pattern
        float noise2 = fbm(vec3(coord * NOISE_SCALE * 1.5 + 50.0, t * 0.6 + 100.0), 2);

        // Slow-moving depth layer
        float noise3 = fbm(vec3(coord * NOISE_SCALE * 0.6 + 25.0, t * 0.25), 2);

        // Combine for organic movement
        float combinedNoise = noise1 * 0.5 + noise2 * 0.3 + noise3 * 0.2;

        // =========================================
        // GRADIENT POSITION CALCULATION
        // =========================================

        // Base vertical position (inverted: 0 at top, 1 at bottom)
        float basePos = 1.0 - uv.y;

        // Apply wave distortion
        float wave = sin(uv.x * 3.0 + t * 0.8) * WAVE_AMOUNT;
        wave += sin(uv.x * 5.0 - t * 0.5) * WAVE_AMOUNT * 0.5;

        // Apply noise distortion to gradient position
        float noiseOffset = combinedNoise * NOISE_INFLUENCE;

        // Final gradient position with all distortions
        float gradientPos = basePos + wave + noiseOffset;

        // Add breathing modulation to stops
        float breatheOffset = breathe * 0.03;

        // Dynamic stops with breathing
        float solidStop = u_stop_solid + breatheOffset;
        float viaStop = u_stop_via + breatheOffset * 0.5;
        float fadeStop = u_stop_fade;

        // =========================================
        // COLOR CALCULATION
        // =========================================

        vec3 color;
        float alpha = 1.0;

        if (gradientPos < solidStop) {
          // Solid primary color region
          color = u_primary;
          alpha = 1.0;
        }
        else if (gradientPos < viaStop) {
          // Transition from primary to secondary
          float t = smoothstep(solidStop, viaStop, gradientPos);
          color = mix(u_primary, u_secondary, t);
          // Start fading alpha
          alpha = 1.0 - t * 0.3;
        }
        else if (gradientPos < fadeStop) {
          // Transition from secondary to base (fading out)
          float t = smoothstep(viaStop, fadeStop, gradientPos);
          color = mix(u_secondary, u_base, t);
          alpha = 0.7 - t * 0.7;
        }
        else {
          // Beyond fade - just base color
          color = u_base;
          alpha = 0.0;
        }

        // =========================================
        // SOFT-LIGHT OVERLAY
        // =========================================

        // Accent noise layer (different pattern)
        float accentNoise = fbm(vec3(coord * NOISE_SCALE * 0.8 + 200.0, t * 0.35 + 300.0), 2);
        accentNoise = accentNoise * 0.5 + 0.5;

        // Apply soft-light with accent color where gradient is visible
        float softLightStrength = SOFT_LIGHT_OPACITY * alpha * accentNoise;
        color = softLight(color, u_accent, softLightStrength);

        // =========================================
        // COMPOSITE ONTO BASE
        // =========================================

        // Blend gradient onto base background
        vec3 finalColor = mix(u_base, color, alpha);

        // =========================================
        // DEPTH & ATMOSPHERE
        // =========================================

        // Subtle brightness variation for depth
        float depthVar = noise1 * 0.06 + noise3 * 0.04;
        finalColor *= (1.0 + depthVar);

        // Very subtle vignette (mostly at corners)
        vec2 vignetteCoord = uv - 0.5;
        float vignette = 1.0 - dot(vignetteCoord * vec2(0.2, 0.15), vignetteCoord * vec2(0.2, 0.15));
        vignette = smoothstep(0.0, 1.0, vignette);
        finalColor = mix(finalColor * 0.98, finalColor, vignette);

        gl_FragColor = vec4(finalColor, 1.0);
      }
    `;

    // =====================================================
    // WEBGL SETUP
    // =====================================================

    const canvas = document.getElementById('canvas');
    const gl = canvas.getContext('webgl', { alpha: false, antialias: true });

    function createShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error('Shader error:', gl.getShaderInfoLog(shader));
        return null;
      }
      return shader;
    }

    const vs = createShader(gl.VERTEX_SHADER, vertexShader);
    const fs = createShader(gl.FRAGMENT_SHADER, fragmentShader);

    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);

    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.error('Link error:', gl.getProgramInfoLog(program));
    }

    gl.useProgram(program);

    // Fullscreen quad
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

    const posLoc = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    // Uniforms
    const uniforms = {
      time: gl.getUniformLocation(program, 'u_time'),
      resolution: gl.getUniformLocation(program, 'u_resolution'),
      primary: gl.getUniformLocation(program, 'u_primary'),
      secondary: gl.getUniformLocation(program, 'u_secondary'),
      accent: gl.getUniformLocation(program, 'u_accent'),
      base: gl.getUniformLocation(program, 'u_base'),
      stop_solid: gl.getUniformLocation(program, 'u_stop_solid'),
      stop_via: gl.getUniformLocation(program, 'u_stop_via'),
      stop_fade: gl.getUniformLocation(program, 'u_stop_fade'),
    };

    // =====================================================
    // STATE & TRANSITIONS
    // =====================================================

    let currentTheme = 'ai';

    let current = {
      primary: [...THEMES.ai.primary],
      secondary: [...THEMES.ai.secondary],
      accent: [...THEMES.ai.accent],
      stops: { ...THEMES.ai.stops },
    };

    let target = JSON.parse(JSON.stringify(current));

    function setTheme(name) {
      currentTheme = name;
      const theme = THEMES[name];

      target.primary = [...theme.primary];
      target.secondary = [...theme.secondary];
      target.accent = [...theme.accent];
      target.stops = { ...theme.stops };

      document.getElementById('themeName').textContent = theme.name;
      document.querySelectorAll('.btn').forEach(b =>
        b.classList.toggle('active', b.dataset.theme === name)
      );
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function lerpColor(arr, target, t) {
      for (let i = 0; i < arr.length; i++) {
        arr[i] = lerp(arr[i], target[i], t);
      }
    }

    // =====================================================
    // RESIZE
    // =====================================================

    function resize() {
      const dpr = Math.min(devicePixelRatio, 2);
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
    }

    resize();
    addEventListener('resize', resize);

    document.querySelectorAll('.btn').forEach(b =>
      b.addEventListener('click', () => setTheme(b.dataset.theme))
    );

    // =====================================================
    // RENDER LOOP
    // =====================================================

    const startTime = performance.now();
    const LERP_FACTOR = 0.035;

    function render(now) {
      // Interpolate colors
      lerpColor(current.primary, target.primary, LERP_FACTOR);
      lerpColor(current.secondary, target.secondary, LERP_FACTOR);
      lerpColor(current.accent, target.accent, LERP_FACTOR);

      // Interpolate stops
      current.stops.solid = lerp(current.stops.solid, target.stops.solid, LERP_FACTOR);
      current.stops.via = lerp(current.stops.via, target.stops.via, LERP_FACTOR);
      current.stops.fade = lerp(current.stops.fade, target.stops.fade, LERP_FACTOR);

      // Update uniforms
      gl.uniform1f(uniforms.time, (now - startTime) / 1000);
      gl.uniform3fv(uniforms.primary, current.primary);
      gl.uniform3fv(uniforms.secondary, current.secondary);
      gl.uniform3fv(uniforms.accent, current.accent);
      gl.uniform3fv(uniforms.base, BASE_COLOR);
      gl.uniform1f(uniforms.stop_solid, current.stops.solid);
      gl.uniform1f(uniforms.stop_via, current.stops.via);
      gl.uniform1f(uniforms.stop_fade, current.stops.fade);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
