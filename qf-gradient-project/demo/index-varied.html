<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QF Gradient - Varied Style</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    // Parse URL parameters for colors (supports 3 or 4 colors)
    // Format: index-varied.html?c1=1B8EE0&c2=797B4D&c3=FFE9D2
    // Or:     index-varied.html?c1=E06B51&c2=DB6B85&c3=7A4D9E&c4=FFE9D2
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        c1: params.get('c1') || 'FFE9D2',
        c2: params.get('c2') || 'FFE9D2',
        c3: params.get('c3') || 'FFE9D2',
        c4: params.get('c4') || null // Optional 4th color
      };
    }

    function hexToRgb(hex) {
      const r = parseInt(hex.substring(0, 2), 16) / 255;
      const g = parseInt(hex.substring(2, 4), 16) / 255;
      const b = parseInt(hex.substring(4, 6), 16) / 255;
      return [r, g, b];
    }

    const urlParams = getUrlParams();
    const color1 = hexToRgb(urlParams.c1);
    const color2 = hexToRgb(urlParams.c2);
    const color3 = hexToRgb(urlParams.c3);
    const color4 = urlParams.c4 ? hexToRgb(urlParams.c4) : [1.0, 0.914, 0.824]; // Default cream
    const numColors = urlParams.c4 ? 4 : 3;

    const vertexShader = `
      attribute vec2 a_position;
      varying vec2 v_uv;
      void main() {
        v_uv = a_position * 0.5 + 0.5;
        gl_Position = vec4(a_position, 0.0, 1.0);
      }
    `;

    // Varied FBM shader - creates organic, pocket-like drift patterns
    // Inspired by Runway Demo Day 2025
    const fragmentShader = `
      precision highp float;
      varying vec2 v_uv;
      uniform float u_time;
      uniform vec2 u_resolution;
      uniform vec3 u_color1, u_color2, u_color3, u_color4;
      uniform int u_numColors;

      #define SPEED 0.40

      vec4 permute(vec4 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
      vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

      float snoise(vec3 v) {
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod(i, 289.0);
        vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 1.0/7.0;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
      }

      // 2-octave FBM for bigger, softer blobs
      float fbm(vec3 p) {
        float value = 0.0;
        value += 0.7 * snoise(p);
        value += 0.3 * snoise(p * 1.6);
        return value;
      }

      void main() {
        vec2 uv = v_uv;
        float aspect = u_resolution.x / u_resolution.y;
        vec2 coord = vec2(uv.x * aspect, uv.y);
        float t = u_time * SPEED;

        // Directional drift: clouds move left-to-right with slight upward angle
        vec2 driftDir = vec2(0.989, 0.148); // ~8.5 degree angle upward
        float driftSpeed = 0.72;
        vec2 drift = driftDir * t * driftSpeed;

        // Medium-sized blobs with good definition
        float noiseScale = 0.55;

        // Apply drift to coordinates for directional movement
        vec2 driftedCoord = coord - drift;

        // Two FBM layers - faster time evolution for organic shape morphing
        float noise1 = fbm(vec3(driftedCoord * noiseScale, t * 0.6));
        float noise2 = fbm(vec3(driftedCoord * noiseScale * 1.4 + 30.0, t * 0.84 + 50.0));

        // Simpler combination for bigger, softer pockets
        float combinedNoise = noise1 * 0.65 + noise2 * 0.35;
        combinedNoise = smoothstep(0.15, 0.85, combinedNoise * 0.5 + 0.5);

        // Mix vertical gradient with noise - reversed so saturated colors appear at top
        float blendFactor = mix(1.0 - uv.y, combinedNoise, 0.55);

        // Multi-color gradient blending (supports 3 or 4 colors)
        vec3 color;
        if (u_numColors == 4) {
          // 4-color gradient: divide into 3 segments
          if (blendFactor < 0.333) {
            color = mix(u_color1, u_color2, smoothstep(0.0, 1.0, blendFactor * 3.0));
          } else if (blendFactor < 0.666) {
            color = mix(u_color2, u_color3, smoothstep(0.0, 1.0, (blendFactor - 0.333) * 3.0));
          } else {
            color = mix(u_color3, u_color4, smoothstep(0.0, 1.0, (blendFactor - 0.666) * 3.0));
          }
        } else {
          // 3-color gradient: divide into 2 segments
          if (blendFactor < 0.5) {
            color = mix(u_color1, u_color2, smoothstep(0.0, 1.0, blendFactor * 2.0));
          } else {
            color = mix(u_color2, u_color3, smoothstep(0.0, 1.0, (blendFactor - 0.5) * 2.0));
          }
        }

        // Subtle depth variation
        color *= 1.0 + noise1 * 0.08;

        // Very subtle vignette
        float vignette = smoothstep(0.0, 1.0, 1.0 - length((uv - 0.5) * 0.3));
        color = mix(color * 0.95, color, vignette);

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    // Performance config (matches standard themes)
    const PERF_CONFIG = {
      maxDPR: 1.5,
      targetFPS: 30,
      pauseWhenHidden: true
    };

    // WebGL setup
    const canvas = document.getElementById('canvas');
    const gl = canvas.getContext('webgl', { alpha: false, antialias: true });

    function createShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error('Shader compile error:', gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    const vs = createShader(gl.VERTEX_SHADER, vertexShader);
    const fs = createShader(gl.FRAGMENT_SHADER, fragmentShader);
    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

    const posLoc = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
      time: gl.getUniformLocation(program, 'u_time'),
      resolution: gl.getUniformLocation(program, 'u_resolution'),
      color1: gl.getUniformLocation(program, 'u_color1'),
      color2: gl.getUniformLocation(program, 'u_color2'),
      color3: gl.getUniformLocation(program, 'u_color3'),
      color4: gl.getUniformLocation(program, 'u_color4'),
      numColors: gl.getUniformLocation(program, 'u_numColors'),
    };

    // Set colors
    gl.uniform3fv(uniforms.color1, color1);
    gl.uniform3fv(uniforms.color2, color2);
    gl.uniform3fv(uniforms.color3, color3);
    gl.uniform3fv(uniforms.color4, color4);
    gl.uniform1i(uniforms.numColors, numColors);

    function resize() {
      const dpr = Math.min(devicePixelRatio, PERF_CONFIG.maxDPR);
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
    }

    resize();
    addEventListener('resize', resize);

    // Animation loop with frame limiting
    const startTime = performance.now();
    const frameInterval = 1000 / PERF_CONFIG.targetFPS;
    let lastFrameTime = 0;
    let isHidden = false;

    // Pause when tab is hidden
    if (PERF_CONFIG.pauseWhenHidden) {
      document.addEventListener('visibilitychange', () => {
        isHidden = document.hidden;
      });
    }

    function render(now) {
      requestAnimationFrame(render);

      if (isHidden) return;
      if (now - lastFrameTime < frameInterval) return;
      lastFrameTime = now;

      gl.uniform1f(uniforms.time, (now - startTime) / 1000);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
