<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QF Impact Index 2026</title>
<link rel="preload" href="fonts/QFSerif-VF.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/QF-VF.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="page.css">
</head>
<body>

<div class="wrap">
  <a class="back" href="index.html">&larr;&nbsp; Back to the Index</a>
</div>

<header class="wrap top">
  <p class="kicker" id="kicker">&nbsp;</p>
  <div class="title-row">
    <h1 id="title">&nbsp;</h1>
    <p class="intro" id="intro">&nbsp;</p>
  </div>
  <nav class="peers" id="peers"></nav>
</header>

<main>
  <section class="wrap blocks" id="blocks"></section>

  <section class="wrap stories">
    <div class="sec-head">
      <div>
        <h2>Key stories</h2>
        <p class="sub" id="stories-sub"></p>
      </div>
      <div class="carousel-ctrl">
        <button class="cbtn" id="prev" type="button" aria-label="Previous story">&larr;</button>
        <button class="cbtn" id="next" type="button" aria-label="Next story">&rarr;</button>
        <span class="counter" id="counter"></span>
      </div>
    </div>
    <div class="rail" id="rail"></div>

    <div class="audio">
      <button class="play" id="play" type="button" aria-label="Play narration">&#9654;</button>
      <div>
        <div class="lbl" id="audio-lbl">Listen to this section</div>
        <div class="note">Narration is AI-generated and may contain occasional errors. Not yet recorded &mdash; the transcript below is the copy it would read.</div>
      </div>
    </div>
  </section>

  <section class="wrap index">
    <div class="sec-head" style="margin-bottom:22px">
      <h2>Index</h2>
    </div>
    <div class="lenses">
      <div class="lens-grp">
        <h4>Lens</h4>
        <div class="lens-opts" id="lens-kind"></div>
      </div>
      <div class="lens-grp" id="lens-wrap">
        <h4 id="lens-label">Filter</h4>
        <div class="lens-opts" id="lens-opts"></div>
      </div>
      <div class="search">
        <input type="search" id="q" placeholder="Search stories&hellip;" aria-label="Search stories">
      </div>
    </div>
    <p class="count" id="count"></p>
    <div class="cards" id="cards"></div>
  </section>
</main>

<script src="data.js"></script>
<script src="vocab.js"></script>
<script src="page.js"></script>
</body>
</html>
